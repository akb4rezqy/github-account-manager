<!-- Form Ambil Akun -->
<div id="ambilForm" class="form-container hidden">
    <h3><i class="fas fa-download"></i> Ambil Akun</h3>
    <p class="form-hint">Pilih akun yang ingin diambil (status Tersedia atau 3 Hari)</p>
    <div id="ambilAccountList"></div>
    <div style="margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap;">
        <button onclick="ambilAkun()" class="btn-ambil">
            <i class="fas fa-download"></i> Ambil Akun
        </button>
        <button onclick="hideAmbilForm()" class="btn-cancel">Tutup</button>
    </div>
</div>
