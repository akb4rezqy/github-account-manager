<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Stock Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        .login-container h1 {
            text-align: center;
            margin-bottom: 8px;
            color: #1a1a1a;
        }
        .login-container .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 24px;
        }
        .login-container input {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 16px;
            border: 1px solid #d0d0d0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
            background: #fafafa;
        }
        .login-container input:focus {
            outline: none;
            border-color: #555;
            background: white;
        }
        .login-container button {
            width: 100%;
            padding: 12px;
            background: #1a1a1a;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        .login-container button:hover { background: #333; }
        .login-container button:disabled { opacity: 0.5; cursor: not-allowed; }
        .error-message {
            color: #dc3545;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
            text-align: center;
            padding: 10px;
            background: #f8d7da;
            border-radius: 8px;
        }
        .error-message.show { display: block; }
        .icon-lock {
            text-align: center;
            font-size: 48px;
            color: #1a1a1a;
            margin-bottom: 16px;
        }
        .footer-text {
            text-align: center;
            margin-top: 20px;
            color: #888;
            font-size: 13px;
        }
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="icon-lock"><i class="fas fa-lock"></i></div>
        <h1>Stock Manager</h1>
        <p class="subtitle">Masuk untuk mengakses dashboard</p>
        
        <div id="errorMessage" class="error-message">
            <i class="fas fa-exclamation-circle"></i> 
            <span id="errorText">Username atau password salah</span>
        </div>
        
        <form id="loginForm">
            <input type="text" id="username" placeholder="Username" required autofocus>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" id="loginButton">
                <span id="buttonText">Masuk</span>
                <span id="buttonSpinner" class="loading-spinner" style="display: none;"></span>
            </button>
        </form>
        
        <div class="footer-text"><i class="fas fa-shield-alt"></i> Login aman</div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const button = document.getElementById('loginButton');
            const buttonText = document.getElementById('buttonText');
            const buttonSpinner = document.getElementById('buttonSpinner');
            const errorMessage = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            
            button.disabled = true;
            buttonText.textContent = 'Memproses...';
            buttonSpinner.style.display = 'inline-block';
            errorMessage.classList.remove('show');
            
            try {
                console.log('📤 Sending login request...');
                
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({ username, password })
                });
                
                console.log('📡 Response status:', response.status);
                
                // ✅ Cek response type
                const contentType = response.headers.get('content-type');
                console.log('📡 Content-Type:', contentType);
                
                let data;
                if (contentType && contentType.includes('application/json')) {
                    data = await response.json();
                    console.log('📡 Response data:', data);
                } else {
                    // ❌ Bukan JSON - coba baca sebagai text
                    const text = await response.text();
                    console.log('📡 Response text:', text);
                    throw new Error('Server mengirim response tidak valid: ' + text.substring(0, 100));
                }
                
                if (response.ok && data.success) {
                    console.log('✅ Login successful, redirecting...');
                    window.location.href = '/';
                } else {
                    errorText.textContent = data.error || 'Username atau password salah';
                    errorMessage.classList.add('show');
                    button.disabled = false;
                    buttonText.textContent = 'Masuk';
                    buttonSpinner.style.display = 'none';
                }
            } catch (error) {
                console.error('❌ Login error:', error);
                errorText.textContent = 'Terjadi kesalahan: ' + error.message;
                errorMessage.classList.add('show');
                button.disabled = false;
                buttonText.textContent = 'Masuk';
                buttonSpinner.style.display = 'none';
            }
        });
    </script>
</body>
</html>
